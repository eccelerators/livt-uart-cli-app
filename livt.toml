[project]
name = "UartCliApp"
version = "1.0.0"
path = "src"
outdir = "out"

[tests]
path = "tests"
components = ["UartCliAppTest"]

[dependencies]
"Eccelerators.Cli" = "1.2.0-dev"
"Livt.IO" = "1.2.0-dev"

[build.debug]
warnings = ["all"]

[build.release]
warnings = ["all"]

[vendor.vivado]
part = "xc7a35tcpg236-1"

[vendor.vivado.ip]
wrapper = "auto"

top = "uartcliapp_wrapper"
vendor = "eccelerators.com"
library = "user"
name = "uartcliapp"
version = "1.0.0"
display_name = "UartCliApp"
description = "Vivado IP generated from a Livt project"
taxonomy = "/UserIP"
include_tests = true
